<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Добавление студента</title>
</head>
<body>
<h2>Добавить нового студента</h2>

<form th:action="@{/students/add}" th:object="${student}" method="post">
    <div>
        <label for="name">ФИО Студента:</label>
        <input type="text" id="name" th:field="*{name}" required />
    </div>
    <br/>
    <div>
        <label for="course">Курс:</label>
        <input type="number" id="course" th:field="*{course}" min="1" max="6" required />
    </div>
    <br/>
    <div>
        <label for="hasDebt">Наличие задолженности:</label>
        <select id="hasDebt" th:field="*{hasDebt}">
            <option th:value="true">Да</option>
            <option th:value="false">Нет</option>
        </select>
    </div>
    <br/>
    <button type="submit">Сохранить студента</button>
    <a th:href="@{/students}" style="margin-left: 10px;">Отмена</a>
</form>
</body>
</html>
